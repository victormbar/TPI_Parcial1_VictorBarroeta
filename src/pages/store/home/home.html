<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Store - Catálogo</title>
    <link rel="icon" type="image/png" href="/assets/pizza.svg" sizes="32x32">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body>
    <header>
        <div class="header-container">
            <h1><img src="/assets/pizza.svg" alt="Logo Food Store" class="logo-titulo"> Food Store</h1>
            <nav>
                <ul>
                    <li><a href="/src/pages/store/home/home.html">Inicio</a></li>
                    <li><a href="/src/pages/store/cart/cart.html">🛒 Carrito</a></li>
                    <li><a href="#" id="logoutButton">Cerrar Sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="contenedor-principal">

        <aside>
            <details open>
                <summary><img src="/assets/pizza.svg" alt="Logo Food Store" class="logo-titulo"> Categorías</summary>
                <ul id="lista-categorias">
                </ul>
            </details>
        </aside>

        <main>
            <form class="search-form" id="form-busqueda">
                <input id="buscarProducto" type="text" placeholder="Ej: Hamburguesa Clásica">
                <button type="submit">Buscar</button>
            </form>

            <div id="main-productos"></div>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 <img src="/assets/pizza.svg" alt="Logo Food Store" class="logo-titulo"> Food Store. Todos los derechos reservados.</p>
        <p>Contacto: info@foodstore.com | Síguenos: <a href="#">Facebook</a> | <a href="#">Instagram</a></p>
    </footer>

    <script type="module" src="./home.ts"></script>
</body>
</html>
