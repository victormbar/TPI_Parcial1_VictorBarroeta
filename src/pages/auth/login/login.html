<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍕 Food Store - Login</title>
</head>

<body>
    <div class="login-container">
        <form class="login-form" id="form-login">
            <h1>🍕 Food Store</h1>
            <h2>Iniciar Sesión</h2>

            <label for="mail">Mail:</label>
            <input type="email" id="mail" placeholder="Ingresa tu mail" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="Mínimo 8 caracteres" required>

            <button type="submit">INGRESAR</button>

            <p class="registro">
                ¿No tienes cuenta? <a href="../registro/registro.html">Regístrate acá</a>
            </p>
        </form>
    </div>
    <script type="module" src="./login.ts"></script>
</body>

</html>
